# Single entry point for ThingsBoard microservices (replaces the HAProxy of the official deployment).
#   /api/v1/*      -> HTTP transport (device API)
#   /api/*, /static/rulenode/*, /oauth2/*, /login/oauth2/*  -> tb-core (REST + WebSocket)
#   /*             -> tb-web-ui
#
# - Containers are resolved at request time via Docker's DNS (127.0.0.11), so nginx starts even while
#   ThingsBoard containers are still booting (it answers 502 until they are up).
# - Every location sets Host explicitly: proxy_set_header is not inherited by locations that set their own,
#   and Tomcat inside ThingsBoard rejects Host values containing "_" with HTTP 400.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 50m;
  proxy_read_timeout 3600s;
  proxy_http_version 1.1;

  set $tb_core   "tb-core1:8080";
  set $tb_http   "tb-http-transport1:8081";
  set $tb_web_ui "tb-web-ui1:8080";

  location /api/v1/ {
    proxy_pass http://$tb_http;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(api|static/rulenode|oauth2|login/oauth2)/ {
    proxy_pass http://$tb_core;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    proxy_pass http://$tb_web_ui;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
